allow_embedding: false
db_schema:
  tblcustomers:
    client: none
    columns:
    - admin_ui: {order: 1, width: 200}
      name: firstname
      type: string
    - admin_ui: {order: 2, width: 200}
      name: surname
      type: string
    - admin_ui: {order: 3, width: 200}
      name: email_address
      type: string
    - admin_ui: {order: 0, width: 200}
      name: customer_ID
      type: string
    server: full
    title: tblCustomers
  tblorderitems:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: order_item_ID
      type: string
    - admin_ui: {order: 1, width: 200}
      name: order_ID
      target: tblorders
      type: link_single
    - admin_ui: {order: 2, width: 200}
      name: staff_ID
      target: tblstaff
      type: link_single
    - admin_ui: {order: 3, width: 200}
      name: cake_type
      type: string
    - admin_ui: {order: 4, width: 200}
      name: sponge_flavour
      type: string
    - admin_ui: {order: 5, width: 200}
      name: filling
      type: string
    - admin_ui: {order: 6, width: 200}
      name: frosting_type
      type: string
    - admin_ui: {order: 7, width: 200}
      name: frosting_flavour
      type: string
    - admin_ui: {order: 8, width: 200}
      name: occasion
      type: string
    - admin_ui: {order: 9, width: 200}
      name: serving_size
      type: number
    - admin_ui: {order: 10, width: 200}
      name: no_of_tiers
      type: number
    - admin_ui: {order: 11, width: 200}
      name: allergies
      type: string
    - admin_ui: {order: 12, width: 200}
      name: additional_details
      type: string
    - admin_ui: {order: 13, width: 200}
      name: inscription
      type: string
    server: full
    title: tblOrderItems
  tblorders:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: Order ID
      type: string
    - admin_ui: {order: 1, width: 200}
      name: customer_ID
      target: tblcustomers
      type: link_single
    - admin_ui: {order: 2, width: 200}
      name: date_of_order
      type: datetime
    - admin_ui: {order: 3, width: 200}
      name: collection_date
      type: datetime
    - admin_ui: {order: 4, width: 200}
      name: order_status
      type: string
    server: full
    title: tblOrders
  tblstaff:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: staff_ID
      type: string
    - admin_ui: {order: 1, width: 200}
      name: firstname
      type: string
    - admin_ui: {order: 2, width: 200}
      name: surname
      type: string
    - admin_ui: {order: 3, width: 200}
      name: email_address
      type: string
    - admin_ui: {order: 4, width: 200}
      name: role
      type: string
    server: full
    title: tblStaff
  tblunavailability:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: Unavailability ID
      type: string
    - admin_ui: {order: 1, width: 200}
      name: Staff ID
      target: tblstaff
      type: link_single
    - admin_ui: {order: 2, width: 200}
      name: Unavailability date
      type: date
    - admin_ui: {order: 3, width: 200}
      name: Reason
      type: string
    server: full
    title: tblUnavailability
