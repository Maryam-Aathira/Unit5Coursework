allow_embedding: false
db_schema:
  tblcustomers:
    client: none
    columns:
    - admin_ui: {order: 1, width: 200}
      name: firstname
      type: string
    - admin_ui: {order: 2, width: 200}
      name: surname
      type: string
    - admin_ui: {order: 3, width: 200}
      name: email_address
      type: string
    - admin_ui: {order: 0, width: 200}
      name: customer_ID
      type: string
    server: full
    title: tblCustomers
  tbldropdownoptions:
    client: full
    columns:
    - admin_ui: {order: 0, width: 200}
      name: category
      type: string
    - admin_ui: {order: 1, width: 200}
      name: choice
      type: string
    server: full
    title: tblDropdownOptions
  tblorderitems:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: order_item_ID
      type: string
    - admin_ui: {order: 1, width: 200}
      name: order_ID
      target: tblorders
      type: link_single
    - admin_ui: {order: 2, width: 200}
      name: staff_ID
      target: tblstaff
      type: link_single
    - admin_ui: {order: 3, width: 200}
      name: cake_type
      type: string
    - admin_ui: {order: 4, width: 200}
      name: sponge_flavour
      type: string
    - admin_ui: {order: 5, width: 200}
      name: filling
      type: string
    - admin_ui: {order: 6, width: 200}
      name: frosting_type
      type: string
    - admin_ui: {order: 7, width: 200}
      name: frosting_flavour
      type: string
    - admin_ui: {order: 8, width: 200}
      name: occasion
      type: string
    - admin_ui: {order: 9, width: 200}
      name: serving_size
      type: number
    - admin_ui: {order: 10, width: 200}
      name: no_of_tiers
      type: number
    - admin_ui: {order: 11, width: 200}
      name: allergies
      type: string
    - admin_ui: {order: 12, width: 200}
      name: additional_details
      type: string
    - admin_ui: {order: 13, width: 200}
      name: inscription
      type: string
    - admin_ui: {order: 14, width: 200}
      name: price
      type: number
    - admin_ui: {order: 2.5, width: 200}
      name: customer_ID
      type: string
    - admin_ui: {order: 15, width: 200}
      name: reference_image
      type: media
    - admin_ui: {order: 2.25, width: 200}
      name: customer
      target: users
      type: link_single
    server: full
    title: tblOrderItems
  tblorders:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: Order ID
      type: string
    - admin_ui: {order: 1, width: 200}
      name: customer_ID
      target: tblcustomers
      type: link_single
    - admin_ui: {order: 2, width: 200}
      name: date_of_order
      type: datetime
    - admin_ui: {order: 3, width: 200}
      name: collection_date
      type: datetime
    - admin_ui: {order: 4, width: 200}
      name: order_status
      type: string
    - admin_ui: {order: 5, width: 200}
      name: total_price
      type: number
    - admin_ui: {order: 0.5, width: 200}
      name: cust_ID
      target: users
      type: link_single
    server: full
    title: tblOrders
  tblstaff:
    client: none
    columns:
    - admin_ui: {order: 1, width: 200}
      name: firstname
      type: string
    - admin_ui: {order: 2, width: 200}
      name: surname
      type: string
    - admin_ui: {order: 3, width: 200}
      name: email_address
      type: string
    - admin_ui: {order: 4, width: 200}
      name: role
      type: string
    - admin_ui: {order: -1, width: 200}
      name: staff_ID
      target: users
      type: link_single
    server: full
    title: tblStaff
  tblunavailability:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: Unavailability ID
      type: string
    - admin_ui: {order: 1, width: 200}
      name: Staff ID
      target: tblstaff
      type: link_single
    - admin_ui: {order: 2, width: 200}
      name: Unavailability date
      type: date
    - admin_ui: {order: 3, width: 200}
      name: Reason
      type: string
    server: full
    title: tblUnavailability
  users:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: email
      type: string
    - admin_ui: {order: 1, width: 200}
      name: enabled
      type: bool
    - admin_ui: {order: 2, width: 200}
      name: last_login
      type: datetime
    - admin_ui: {order: 3, width: 200}
      name: password_hash
      type: string
    - admin_ui: {order: 4, width: 200}
      name: n_password_failures
      type: number
    - admin_ui: {order: 5, width: 200}
      name: confirmed_email
      type: bool
    - admin_ui: {order: -1, width: 200}
      name: firstname
      type: string
    - admin_ui: {order: -0.5, width: 200}
      name: surname
      type: string
    - admin_ui: {order: -2, width: 200}
      name: user_ID
      type: string
    server: full
    title: Users
dependencies: []
metadata: {logo_img: 'asset:Logo.jpg'}
name: M3 App 1
package_name: M3_App_1
renamed: true
runtime_options:
  client_version: '3'
  server_spec: {base: python310-minimal}
  server_version: python3-sandbox
  version: 2
services:
- client_config: {}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_signup: true, confirm_email: false, enable_automatically: true, use_email: true}
  server_config:
    email_content:
      confirm_address:
        html: |-
          <p>Thanks for registering your account with us. Please click the following link to confirm that this is your account:</p>
          <p>{{confirm_link}}</p>
          <p>Thanks,</p>
          <p>The team</p>
      reset_password:
        html: |-
          <p>Hi there,</p>
          <p>You have requested a password reset for your account {{email}}. To reset your password, click the link below:</p>
          <p>{{reset_link}}</p>
          <p>This link will expire in ten minutes.</p>
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/anvil/email.yml
startup: {module: Home, type: form}
startup_form: null
