components:
- components:
  - event_bindings: {click: customer_login_button_click}
    layout_properties: {grid_position: 'VLJNNW,RMDLMX'}
    name: customer_login_button
    properties: {role: outlined-button, text: Customer Login}
    type: Button
  - event_bindings: {click: employee_login_button_click}
    layout_properties: {grid_position: 'ORGOEI,HIDTKD'}
    name: employee_login_button
    properties: {role: outlined-button, text: Employee Login}
    type: Button
  - layout_properties: {grid_position: 'NXUZNQ,VCBJCU'}
    name: manager_login_button
    properties: {role: outlined-button, text: 'Manager Login '}
    type: Button
  layout_properties: {slot: default}
  name: content_panel
  properties: {}
  type: ColumnPanel
- layout_properties: {slot: nav-right}
  name: navbar_links
  properties: {}
  type: FlowPanel
- layout_properties: {slot: title}
  name: login_title
  properties: {text: Login}
  type: Label
container:
  properties: {html: '@theme:standard-page.html'}
  type: HtmlTemplate
is_package: true
