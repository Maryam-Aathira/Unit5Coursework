components:
- components:
  - event_bindings: {click: staff_login_button_click}
    layout_properties: {grid_position: 'ORGOEI,HIDTKD'}
    name: staff_login_button
    properties: {role: outlined-button, text: Login}
    type: Button
  - event_bindings: {click: sign_up_button_click}
    layout_properties: {grid_position: 'CDQODW,HIVACC'}
    name: sign_up_button
    properties: {role: outlined-button, text: Create an account}
    type: Button
  - event_bindings: {click: home_click}
    layout_properties: {grid_position: 'QSCABT,CIMOLL'}
    name: home
    properties: {text: Home}
    type: Button
  layout_properties: {slot: default}
  name: content_panel
  properties: {}
  type: ColumnPanel
- layout_properties: {slot: nav-right}
  name: navbar_links
  properties: {}
  type: FlowPanel
- layout_properties: {slot: title}
  name: login_title
  properties: {text: Login}
  type: Label
container:
  properties: {html: '@theme:standard-page.html'}
  type: HtmlTemplate
is_package: true
