components:
- components:
  - event_bindings: {click: browse_button_click}
    layout_properties: {grid_position: 'TXBIEN,PHEUHI'}
    name: browse_button
    properties: {text: Browse}
    type: Button
  - layout_properties: {grid_position: 'TXBIEN,LQUJKS'}
    name: cake_care1
    properties:
      text: "Cake Care:\nSponge and buttercream standard flavours:\nVanilla\nChocolate Salted Caramel\nLemon \nOrange \nAlmond \nChocolate orange \n\nAdditional fillings:\nRaspberry jam\nStrawberry jam\n\nAny flavours or fillings not listed can be requested and made with an extra cost. \n\n"
    type: Label
  - event_bindings: {click: create_button_click}
    layout_properties: {grid_position: 'YTAXFQ,HEMDUI'}
    name: create_button
    properties: {text: Create a Custom Cake}
    type: Button
  - layout_properties: {grid_position: 'YTAXFQ,ENFXVG'}
    name: cake_care2
    properties:
      text: "Cake Care:\n- In the summer it is important to keep the cake as cool as possible as buttercream can melt/soften.\n\n- Prior to serving, keep the cake out of direct sunlight to maintain firmness. \n\n- If the cake isn’t being served on the day of collection, keep the cake in the fridge to ensure the buttercream stays firm. \n\n- Take the cake out of the fridge approximately 2 hours prior to serving for best texture.\n\n"
    type: Label
  layout_properties: {slot: default}
  name: content_panel
  properties: {}
  type: ColumnPanel
- components:
  - event_bindings: {click: login_button_click}
    layout_properties: {}
    name: login_button
    properties: {text: Login}
    type: Button
  - event_bindings: {click: view_orders_click}
    layout_properties: {}
    name: view_orders
    properties: {text: View Orders}
    type: Button
  - event_bindings: {click: view_account_click}
    layout_properties: {}
    name: view_account
    properties: {text: View Account}
    type: Button
  layout_properties: {slot: nav-right}
  name: navbar_links
  properties: {}
  type: FlowPanel
- layout_properties: {slot: title}
  name: title
  properties: {text: Cakes Bakes Cardiff}
  type: Label
- layout_properties: {slot: top-left-btn}
  name: logo
  properties: {height: 44.666656494140625, source: _/theme/Logo.jpg}
  type: Image
container:
  data_bindings: []
  properties: {html: '@theme:standard-page.html'}
  type: HtmlTemplate
is_package: true
